# Render Blueprint: Settlr deploy
# Deploy: New -> Blueprint -> select this repo. Creates Postgres and the API.
# The web console is deployed separately (Vercel, or any Next.js host) because it only needs
# NEXT_PUBLIC_API_URL and the PayPal client id at build time.
#
# Set the secret env vars in the dashboard after the first deploy:
#   PAYPAL_CLIENT_ID / PAYPAL_CLIENT_SECRET
#   AUTH_SECRET / VERIFIER_HMAC_SECRET (openssl rand -hex 32)
#   WEB_ORIGINS (the console URL), WEB_RETURN_URL / WEB_CANCEL_URL, PUBLIC_API_URL
#   CHANNEL3_API_KEY (optional), GROQ_API_KEY (optional, adjudicator)
services:
  - type: web
    name: settlr-api
    runtime: node
    plan: free
    region: oregon
    rootDir: .
    # tsc and tsx are devDependencies, and NODE_ENV=production makes npm skip them.
    buildCommand: npm ci --include=dev && npm run -w apps/api build
    # Migrations are forward-only and idempotent; applying them before the server starts
    # keeps a fresh database from serving requests against missing tables.
    startCommand: node apps/api/dist/migrate.js && node apps/api/dist/server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PAYPAL_ENV
        value: sandbox
      - key: DATABASE_URL
        fromDatabase:
          name: settlr-db
          property: connectionString
      - key: WEB_ORIGINS
        sync: false
      - key: WEB_RETURN_URL
        sync: false
      - key: WEB_CANCEL_URL
        sync: false
      - key: PUBLIC_API_URL
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: VERIFIER_HMAC_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: CHANNEL3_API_KEY
        sync: false

  - type: web
    name: settlr-web
    runtime: node
    plan: free
    region: oregon
    rootDir: .
    buildCommand: npm ci && npm run -w apps/web build
    startCommand: npm run -w apps/web start -- -H 0.0.0.0 -p $PORT
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NEXT_PUBLIC_PAYPAL_CLIENT_ID
        sync: false
      - key: NEXT_PUBLIC_PAYPAL_ENV
        value: sandbox
databases:
  - name: settlr-db
    plan: free
    region: oregon
    databaseName: settlr
    user: settlr
